name: Verify Contractor.AI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: contractor_ai
          POSTGRES_USER: contractor_ai
          POSTGRES_PASSWORD: contractor-ai-ci-password
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,noexec,nosuid,size=512m
          --health-cmd "pg_isready -U contractor_ai -d contractor_ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CONTRACTOR_AI_POSTGRES_TEST_URL: postgresql://contractor_ai:contractor-ai-ci-password@localhost:5432/contractor_ai?sslmode=verify-full
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Enable TLS on PostgreSQL test service
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker ps --filter publish=5432 --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          tls_dir="$(mktemp -d)"
          trap 'rm -rf "$tls_dir"' EXIT
          openssl req -new -x509 -nodes -days 1 -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' \
            -keyout "$tls_dir/server.key" -out "$tls_dir/server.crt"
          cp "$tls_dir/server.crt" "$GITHUB_WORKSPACE/.ci-postgres-ca.crt"
          echo "NODE_EXTRA_CA_CERTS=$GITHUB_WORKSPACE/.ci-postgres-ca.crt" >> "$GITHUB_ENV"
          docker cp "$tls_dir/server.key" "$container_id:/tmp/contractor-ai-server.key"
          docker cp "$tls_dir/server.crt" "$container_id:/tmp/contractor-ai-server.crt"
          docker exec --user root "$container_id" \
            chown postgres:postgres /tmp/contractor-ai-server.key /tmp/contractor-ai-server.crt
          docker exec --user root "$container_id" chmod 600 /tmp/contractor-ai-server.key
          docker exec --user root "$container_id" chmod 644 /tmp/contractor-ai-server.crt
          docker exec --user postgres "$container_id" psql -U contractor_ai -d contractor_ai -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET ssl = 'on'" \
            -c "ALTER SYSTEM SET ssl_key_file = '/tmp/contractor-ai-server.key'" \
            -c "ALTER SYSTEM SET ssl_cert_file = '/tmp/contractor-ai-server.crt'" \
            -c "SELECT pg_reload_conf()"
          docker exec "$container_id" pg_isready -U contractor_ai -d contractor_ai
          test "$(docker exec --user postgres "$container_id" psql -U contractor_ai -d contractor_ai -Atc 'SHOW ssl')" = "on"
      - run: npm run verify:release
      - run: npm run verify:hai-contract
      - run: npm run lint
      - run: npm run build
      - run: npm run verify:bundle
      - run: npm run test:frontend
      - run: npm test
        timeout-minutes: 45
      - name: Verify representative production-scale ledger performance
        run: npm run benchmark:ledger -- --output artifacts/ledger-benchmark-ci.json
        timeout-minutes: 10
      - name: Upload ledger performance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ledger-performance-report
          path: artifacts/ledger-benchmark-ci.json
          if-no-files-found: warn
      - run: npm run test:container
        timeout-minutes: 10
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 10
      - run: npm run test:browser
        timeout-minutes: 45

  windows-standalone:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package:windows
      - run: npm run test:windows-package
      - name: Package portable Windows folder
        shell: powershell
        run: Compress-Archive -Path release/ContractorAI-windows-x64/* -DestinationPath release/ContractorAI-windows-x64.zip -Force
      - uses: actions/upload-artifact@v7
        with:
          name: ContractorAI-windows-x64
          path: release/ContractorAI-windows-x64.zip
          if-no-files-found: error
